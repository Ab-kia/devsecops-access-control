name: secret-check
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm DINEDESK_DEMO_KEY is configured (never prints it)
        env:
          DINEDESK_DEMO_KEY: ${{ secrets.DINEDESK_DEMO_KEY }}
        run: |
          if [ -n "$DINEDESK_DEMO_KEY" ]; then
            echo "DINEDESK_DEMO_KEY is configured"
          else
            echo "DINEDESK_DEMO_KEY is NOT configured"
            exit 1
          fi
